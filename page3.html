<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page3</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <form action="page4.html">
        <div class="container">
            <h1>Academic Details</h1>

            <div class="form-group">
            <label>10th School Name</label>
            <input type="text" placeholder="Enter your 10th School Name"><br>
            </div>

            <div class="form-group">
            <label>Board Name</label>
            <input type="text" placeholder="Enter your Board Name"><br>
            </div>

            <div class="form-group">
            <label>Passing year</label>
            <input type="text" placeholder="Enter your Passing year"><br>
            </div>

            <div class="form-group">
            <label>Percentage</label>
            <input type="text" placeholder="Enter your Percentage"><br>
            </div>

            <div class="form-group">
            <label>12th school Name</label>
            <input type="text" placeholder="Enter your 12th school Name"><br>
            </div>

            <div class="form-group">
            <label>Stream</label>
            <input type="text" placeholder="Enter your Stream"><br>
            </div>

            <div class="form-group">
            <label>Roll Number</label>
            <input type="text" placeholder="Enter your Roll Number"><br>
            </div>

            <div class="form-group">
            <label>College Preference</label>
            <input type="text" placeholder="Enter your College Preference"><br>
            </div>

            <div class="form-group">
            <label>Course Name</label>
             <select name="course Name">
        <option>Choose Course</option>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>B.Sc</option>
        <option>B.Com</option>
        <option>BA</option>
        <option>MBBS</option>
        <option>BDS</option>
        <option>BBA</option>
        <option>LLB</option>
        <option>Diploma</option>
        <option>ITI</option>
        <option>Hotel Management</option>
        <option>Fashion Designing</option>
        <option>Animation</option>
        <option>Graphic Designing</option>
    </select>
            </div>

            <div class="form-group">
            <label>Language</label>
            <select name="language">
                <option>Please select</option>
                <option value="english">English</option>
                <option value="hindi">Hindi</option>
                <option value="marathi">Marathi</option>
                <option value="gujarati">Gujarati</option>
                <option value="bengali">Bengali</option>
                <option value="tamil">Tamil</option>
                <option value="telugu">Telugu</option>
                <option value="kannada">Kannada</option>
                <option value="urdu">Urdu</option>
            </select><br>
            </div>

            <div class="btn-box">
                <button type="button" class="prev-btn" onclick="window.location.href='page2.html'">Previous</button>
            <button href="page4.html">Save & Next page</button>
            </div>

        </div>
    </form>   
</body>
</html>
