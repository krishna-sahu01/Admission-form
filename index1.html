<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <form action="page2.html">
        
            <div class="container">
            <h1>Personal Details</h1>

            <div class="form-group">
                
            <label>Full Name</label>
            <input type="text" placeholder="Enter your full Name"><br>
            </div>

            <div class="form-group">
            <label>Father Name</label>
            <input type="text" placeholder="Enter your Father Name"><br>
            </div>

            <div class="form-group">
            <label>Mother Name</label>
            <input type="text" placeholder="Enter your Mother Name"><br>
            </div>

            <div class="form-group">
            <label>Date of Birth</label>
            <input type="date"><br>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select>
                    <option>Please select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                
            <label>Mobile Number</label>
            <input type="tel" maxlength="10" placeholder="Enter your Mobile no."><br>
            </div>
            
            <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your Email"><br>
            </div>
            
            <div class="form-group">
            <label for="aadhaar">Aadhaar Number</label>
            <input type="text" id="aadhaar"  name="aadhaar"  maxlength="12"  placeholder="Enter Aadhaar Number"><br>
            </div>

            <div class="form-group">
            <label for="blood_group">Blood Group</label>
            <select name="blood_group" id="blood_group">
                <option>please select</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select><br>
            </div>

        <div class="form-group">
        <label>Category</label>
        <select>
        <option>Select Category</option>
        <option>General</option>
        <option>OBC</option>
        <option>SC</option>
        <option>ST</option>
        </select>
        </div>

        <div class="btn-box">
         <button href="page2.html">Save Details</button>
        </div>

        </div>   
        </form>    
</body>
</html>
